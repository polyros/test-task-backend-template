name: AI Code Review

on:
  workflow_run:
    workflows: ["Test Task Check"]
    types: [completed]

jobs:
  ai-review:
    # Запускаем только если тесты прошли успешно
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Get PR diff
        run: |
          git diff origin/main...HEAD > diff.txt
          echo "Diff size: $(wc -l < diff.txt) lines"

      - name: Get REVIEW.md
        run: |
          if [ -f REVIEW.md ]; then
            cat REVIEW.md > review.txt
          else
            echo "(REVIEW.md не найден)" > review.txt
          fi

      - name: Claude AI Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python scripts/claude_review.py \
            --diff diff.txt \
            --review review.txt \
            --output result.json \
            --task-type backend

      - name: Upload review result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-result
          path: result.json

      - name: Generate PR comment
        if: always()
        run: |
          if [ -f result.json ]; then
            python3 << 'PYEOF'
          import json

          with open('result.json', 'r') as f:
              result = json.load(f)

          score = result.get('score', 0)
          emoji = '✅' if score >= 60 else ('⚠️' if score >= 40 else '❌')
          breakdown = result.get('breakdown', {})

          problems_found = '\n'.join([f"- `{p}`" for p in result.get('problems_found', [])]) or '_Не указаны_'
          problems_fixed = '\n'.join([f"- `{p}`" for p in result.get('problems_fixed', [])]) or '_Не указаны_'
          strengths = '\n'.join([f"- {s}" for s in result.get('strengths', [])]) or '_Не указаны_'
          improvements = '\n'.join([f"- {s}" for s in result.get('improvements', [])]) or '_Не указаны_'

          comment = f"""## {emoji} AI Code Review

          **Оценка: {score}/100**

          {result.get('summary', '')}

          ### Breakdown
          | Критерий | Баллы |
          |----------|-------|
          | Найденные проблемы | {breakdown.get('problems', 0)}/30 |
          | Качество исправлений | {breakdown.get('fixes', 0)}/35 |
          | Качество review | {breakdown.get('review', 0)}/15 |
          | Качество тестов | {breakdown.get('tests', 0)}/20 |

          ### Найденные проблемы
          {problems_found}

          ### Исправленные проблемы
          {problems_fixed}

          ### Сильные стороны
          {strengths}

          ### Рекомендации по улучшению
          {improvements}

          ---
          *Рекомендация: **{result.get('recommendation', 'N/A')}***
          """

          # Убираем лишние отступы
          import textwrap
          comment = textwrap.dedent(comment)

          with open('pr_comment.md', 'w') as f:
              f.write(comment)
          PYEOF
          fi

      - name: Post PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let body;
            try {
              body = fs.readFileSync('pr_comment.md', 'utf8');
            } catch (e) {
              console.log('Не удалось прочитать pr_comment.md:', e);
              return;
            }

            const prs = context.payload.workflow_run.pull_requests;
            if (prs && prs.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                body: body
              });
            } else {
              console.log('PR не найден для этого workflow run');
            }

      - name: Notify HR-Agent
        if: always()
        env:
          HR_AGENT_WEBHOOK_URL: ${{ secrets.HR_AGENT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -n "$HR_AGENT_WEBHOOK_URL" ] && [ -f result.json ]; then
            jq --arg repo "${{ github.repository }}" \
               --arg sha "${{ github.event.workflow_run.head_sha }}" \
               --arg task_type "backend" \
               '. + {repo: $repo, sha: $sha, task_type: $task_type}' result.json > payload.json

            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            if [ -n "$PR_NUMBER" ]; then
              jq --arg pr "$PR_NUMBER" '. + {pr: $pr}' payload.json > payload_with_pr.json
              mv payload_with_pr.json payload.json
            fi

            # Подписываем payload с помощью HMAC-SHA256
            PAYLOAD=$(cat payload.json)
            if [ -n "$WEBHOOK_SECRET" ]; then
              SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)
              curl -X POST "$HR_AGENT_WEBHOOK_URL/api/v1/test-task/review" \
                -H "Content-Type: application/json" \
                -H "X-Webhook-Signature: sha256=$SIGNATURE" \
                -d "$PAYLOAD" || echo "Не удалось отправить webhook"
            else
              # Без подписи (для обратной совместимости)
              curl -X POST "$HR_AGENT_WEBHOOK_URL/api/v1/test-task/review" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" || echo "Не удалось отправить webhook"
            fi
          fi
