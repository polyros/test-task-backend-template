name: Test Task Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Нужно для git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ --tb=short -v

      - name: Generate diff
        if: github.event_name == 'pull_request'
        run: |
          git diff origin/main...HEAD > /tmp/candidate.diff

      - name: AI Code Review
        if: github.event_name == 'pull_request'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Установка Claude CLI
          npm install -g @anthropic-ai/claude-code || true

          # Запуск AI review
          python scripts/claude_review.py \
            --diff /tmp/candidate.diff \
            --review REVIEW.md \
            --output /tmp/ai_review.json \
            --task-type backend

          # Вывод результата
          cat /tmp/ai_review.json
        continue-on-error: true

      - name: Post AI Review Comment
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/ai_review.json ]; then
            SCORE=$(jq -r '.score // "N/A"' /tmp/ai_review.json)
            RECOMMENDATION=$(jq -r '.recommendation // "review"' /tmp/ai_review.json)
            SUMMARY=$(jq -r '.summary // "Результат review недоступен"' /tmp/ai_review.json)
            STRENGTHS=$(jq -r '.strengths // [] | map("- " + .) | join("\n")' /tmp/ai_review.json)
            IMPROVEMENTS=$(jq -r '.improvements // [] | map("- " + .) | join("\n")' /tmp/ai_review.json)

            EMOJI="⏳"
            if [ "$RECOMMENDATION" = "pass" ]; then EMOJI="✅"; fi
            if [ "$RECOMMENDATION" = "reject" ]; then EMOJI="❌"; fi

            gh pr comment ${{ github.event.pull_request.number }} --body "## ${EMOJI} AI Code Review

**Оценка:** ${SCORE}/100
**Рекомендация:** ${RECOMMENDATION}

### Резюме
${SUMMARY}

### Сильные стороны
${STRENGTHS:-Не определены}

### Что можно улучшить
${IMPROVEMENTS:-Не определены}

---
*Автоматический review от Claude AI*"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "## ⏳ AI Code Review

AI review не был выполнен. Требуется ручная проверка.

---
*Автоматический review от Claude AI*"
          fi

      - name: Notify HR-Agent
        if: always()
        env:
          HR_AGENT_WEBHOOK_URL: ${{ secrets.HR_AGENT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -n "$HR_AGENT_WEBHOOK_URL" ]; then
            # Читаем AI review результат если есть
            AI_SCORE="null"
            AI_RECOMMENDATION="null"
            if [ -f /tmp/ai_review.json ]; then
              AI_SCORE=$(jq -r '.score // null' /tmp/ai_review.json)
              AI_RECOMMENDATION=$(jq -r '.recommendation // null' /tmp/ai_review.json)
            fi

            PAYLOAD=$(cat <<EOFPAYLOAD
          {
            "repo": "${{ github.repository }}",
            "pr": "${{ github.event.pull_request.number }}",
            "status": "${{ job.status }}",
            "sha": "${{ github.sha }}",
            "actor": "${{ github.actor }}",
            "event": "${{ github.event_name }}",
            "ai_score": ${AI_SCORE},
            "ai_recommendation": "${AI_RECOMMENDATION}"
          }
          EOFPAYLOAD
            )

            # Вычисляем HMAC подпись
            if [ -n "$WEBHOOK_SECRET" ]; then
              SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)
              curl -X POST "$HR_AGENT_WEBHOOK_URL/api/v1/test-task/review" \
                -H "Content-Type: application/json" \
                -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
                -d "$PAYLOAD" || true
            else
              curl -X POST "$HR_AGENT_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" || true
            fi
          fi
