name: Test Task Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ --tb=short -v

      - name: Notify HR-Agent
        if: always()
        env:
          HR_AGENT_WEBHOOK_URL: ${{ secrets.HR_AGENT_WEBHOOK_URL }}
        run: |
          if [ -n "$HR_AGENT_WEBHOOK_URL" ]; then
            curl -X POST "$HR_AGENT_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{
                "repo": "${{ github.repository }}",
                "pr": "${{ github.event.pull_request.number }}",
                "status": "${{ job.status }}",
                "sha": "${{ github.sha }}",
                "actor": "${{ github.actor }}",
                "event": "${{ github.event_name }}"
              }' || true
          fi
